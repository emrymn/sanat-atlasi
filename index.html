<!doctype html>
<html lang="tr" data-tema="gece">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sanat Atlası</title>
    <meta name="description" content="Kişisel sanat tarihi çalışma uygulaması" />
    <meta name="theme-color" content="#0B0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- yazı tipi çizimi engellemesin: önce print olarak yükle, sonra etkinleştir -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Archivo:wght@400;500;600;700&display=swap"
      crossorigin
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Temayı ilk boyamadan önce uygula (yanıp sönmeyi önler)
      try {
        var i = JSON.parse(localStorage.getItem('sanat-atlasi:ilerleme') || '{}');
        var t = i.ayarlar.tema;
        // sürüm 1: Sepya (eski varsayılan) ve Koyu bir kez Gece'ye geçer (js/depo.js ile aynı kural)
        if (!(i.surum >= 2) && (t === 'sepya' || t === 'koyu')) t = 'gece';
        if (t) document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
      // Gömülü önizleme ortamları (ör. v0) her hash değişiminde document.querySelector(location.hash)
      // çağırıp çapaya kaydırmaya çalışıyor; '#/gozat' gibi rota hash'leri geçerli seçici olmadığı için
      // SyntaxError fırlıyor. Rota hash'lerini "eşleşen öğe yok" olarak yanıtla.
      (function () {
        var asil = Document.prototype.querySelector;
        Document.prototype.querySelector = function (secici) {
          if (typeof secici === 'string' && secici.charAt(0) === '#' && secici.charAt(1) === '/') return null;
          return asil.call(this, secici);
        };
      })();
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="uygulama" tabindex="-1"><p class="ikincil" style="padding-top: 40vh; text-align: center">Yükleniyor…</p></main>
    <nav id="sekmeler" class="sekmeler" aria-label="Ana gezinme" hidden></nav>
    <div id="bildirim" role="status" aria-live="polite" hidden></div>
    <noscript>Sanat Atlası JavaScript gerektirir.</noscript>
  </body>
</html>
