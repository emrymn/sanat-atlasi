name: Testler

# Yalnız PR'larda çalışır (main'e birleştirince aynı testi ikinci kez koşmasın; GitHub'da gereksiz iş azalsın)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest 26.04 oldu (2026-11); Playwright 1.56.1 orada tarayıcı kuramıyor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # birim testleri tarayıcıya ihtiyaç duymaz: Playwright kurulamasa da sonuç versin
      - run: npm run test:unit
      # görsel betiklerinin (scripts/*.py) ağsız birim testleri (İş 173)
      - run: python3 -m unittest discover -s tests/py -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
