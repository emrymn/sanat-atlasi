name: Testler

# Yalnız PR'larda çalışır (main'e birleştirince aynı testi ikinci kez koşmasın; GitHub'da gereksiz iş azalsın)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest 26.04 oldu (2026-11); Playwright 1.56.1 orada tarayıcı kuramıyor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # birim testleri tarayıcıya ihtiyaç duymaz: Playwright kurulamasa da sonuç versin
      - run: npm run test:unit
      # Ubuntu aynası bazen çözülemiyor (2026-11): eksik kalan yalnız yazı tipi paketleri; sistem kitaplıkları
      # makinede hazır. Bağımlılık kurulamazsa tarayıcı tek başına kurulur, testler yine çalışır.
      - run: npx playwright install chromium
      - run: timeout 300 npx playwright install-deps chromium || echo "::warning::Playwright bağımlılıkları kurulamadı (apt aynası); hazır kitaplıklarla devam"
      - run: npm run test:e2e
